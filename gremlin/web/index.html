<div class="app">
  <!-- ===================== Sidebar ===================== -->
  <aside class="sidebar">
    <div class="brand">
      <span class="logo" id="brandLogo"></span>
      <div>
        <div class="brand-name">Gremlin<span class="dot">.</span></div>
        <div class="brand-sub">agent console</div>
      </div>
    </div>

    <div class="nav-label">Explore</div>
    <div class="nav-item" data-route="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
      <span>Overview</span>
    </div>
    <div class="nav-item" data-route="/live">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M5 12a7 7 0 0114 0M2 12a10 10 0 0120 0"/></svg>
      <span>Live run</span>
      <span class="pulse idle" id="navPulse"></span>
    </div>
    <div class="nav-item" data-route="/trace">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3" cy="6" r="1.4"/><circle cx="3" cy="12" r="1.4"/><circle cx="3" cy="18" r="1.4"/></svg>
      <span>Trace</span>
      <span class="count" id="navSteps">0</span>
    </div>
    <div class="nav-item" data-route="/bugs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2l1.5 2.5M16 2l-1.5 2.5"/><rect x="6" y="6" width="12" height="13" rx="6"/><path d="M6 11H2M22 11h-4M6 15H2M22 15h-4M12 6v13"/></svg>
      <span>Bugs</span>
      <span class="count" id="navBugs">0</span>
    </div>

    <div class="nav-label">Evidence</div>
    <div class="nav-item" data-route="/benchmark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Benchmark</span>
    </div>

    <div class="sidebar-foot">
      <div class="status-chip">
        <span class="pulse idle" id="footPulse"></span>
        <span class="label" id="footStatus">Idle</span>
        <span class="val" id="footTarget">com.scribe.scribe</span>
      </div>
    </div>
  </aside>

  <!-- ===================== Main ===================== -->
  <div class="main">
    <header class="topbar">
      <div class="crumb">
        <span>Gremlin</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
        <span class="here" id="crumbHere">Overview</span>
      </div>
      <div class="topbar-spacer"></div>
      <button class="btn btn-primary" id="topStart">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span id="topStartLabel">Start run</span>
      </button>
      <button class="icon-btn" id="themeToggle" title="Toggle theme">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
    </header>

    <main class="view" id="view">
      <div class="skeleton">loading…</div>
    </main>
  </div>
</div>
