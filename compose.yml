# Gremlin, containerised for the lab workstation.
#
# Two services, because the model and the engine have nothing in common: the
# `vllm` service owns the GPU and serves an OpenAI-compatible endpoint, and the
# `gremlin` service is the dev shell you work in. They meet over the compose
# network at http://vllm:8000/v1, which is the whole of the integration —
# exactly the "configuration-only" swap Objective 2 of PROPOSAL.md promises.
#
#   docker compose up -d vllm      # start the model
#   docker compose run --rm gremlin  # get a shell
#
# Run from the repo root. Every tunable below is read from .env.

name: gremlin

services:
  # ---------------------------------------------------------------------
  # Inference backend. Pick one; both serve the same OpenAI-compatible API,
  # so gremlin/local.py talks to either without a code change.
  #
  #   docker compose up -d ollama   # easy path
  #   docker compose up -d vllm     # faster, fussier
  #
  # Both sit behind profiles so neither starts by accident; naming one on the
  # command line is enough to bring it up.
  # ---------------------------------------------------------------------

  # The pragmatic backend. Ollama ships CUDA 12 builds, so it runs on drivers
  # that the current vLLM images have already moved past, and it pulls model
  # weights itself in GGUF form — far smaller than the safetensors vLLM wants.
  # Slower per request than vLLM, which matters for benchmark numbers but not
  # for getting the pipeline working.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes:
      # Our own model store. Nothing here touches another Ollama on the host.
      - ollama-models:/root/.ollama
    ports:
      # Deliberately not 11434: another Ollama may already hold that port.
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"
    environment:
      # Unload the model after a short idle so a shared GPU is given back
      # rather than held for as long as the container happens to be up.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  vllm:
    profiles: ["vllm"]
    # Blackwell (RTX 5090, sm_120) needs CUDA 12.8+, and Qwen3-VL needs a vLLM
    # recent enough to know the architecture — so this deliberately floats
    # rather than pinning a version that predates either. Pin it once you have
    # a build that works, so your benchmark numbers stay reproducible.
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    # Weights are downloaded once into a named volume. Deleting the container
    # does not re-download tens of GB.
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      # Only needed for gated checkpoints; Qwen is Apache-2.0 and open.
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      # The runtime refuses to start a container whose declared CUDA
      # requirement exceeds the host driver. Because CUDA is compatible across
      # minor versions, an image asking for 12.9 generally runs fine on a 12.8
      # driver, and setting this to 1 waives the check. It does NOT bridge a
      # major version: a CUDA 13 image on a 12.x driver will start and then
      # fail, so use it to cross a minor gap and not as a blanket override.
      NVIDIA_DISABLE_REQUIRE: ${NVIDIA_DISABLE_REQUIRE:-}
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    # vLLM shares tensors between worker processes over /dev/shm, and Docker's
    # 64 MB default is far too small — it surfaces as a hang or a bus error
    # during load. The documented remedy is `ipc: host`, but that shares the
    # host's IPC namespace and is commonly forbidden on managed hosts (an
    # opa-docker-authz policy rejects it outright). Sizing /dev/shm for this
    # container alone achieves the same thing without the namespace, and is
    # ample for the single-GPU, tensor-parallel-1 case here.
    shm_size: ${VLLM_SHM_SIZE:-8gb}
    command:
      - --model=${VLLM_MODEL:-Qwen/Qwen3-VL-8B-Instruct}
      # A stable alias, so switching checkpoints never touches Gremlin's config.
      - --served-model-name=gremlin-vision
      # Screenshots are large inputs; this is sized for one image plus the
      # short JSON decision the policy asks for, not for long conversations.
      - --max-model-len=${VLLM_MAX_LEN:-16384}
      - --gpu-memory-utilization=${VLLM_GPU_FRAC:-0.90}
      - '--limit-mm-per-prompt={"image":1}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # Weight loading is slow, hence the long start_period; until this passes,
      # the engine would only get connection refused.
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: ${VLLM_START_PERIOD:-15m}
    restart: unless-stopped

  gremlin:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      # The repo itself, live — edits inside the container are edits on disk.
      - .:/workspace
      # Claude Code's login, kept off the bind mount so a rebuild never loses it.
      - claude-config:/home/gremlin/.claude
      # Git identity and any stored credential, likewise kept off the bind
      # mount — writing them into the repo would risk committing them.
      - git-state:/home/gremlin/.gitstate
    environment:
      # Points git's global config at the persisted volume, so `git config
      # --global` survives the container being thrown away by `run --rm`.
      GIT_CONFIG_GLOBAL: /home/gremlin/.gitstate/gitconfig
      # No developer home to scan inside the container: the repo's own
      # defect-seeded fixtures are the apps under test.
      GREMLIN_PROJECTS_ROOT: ${GREMLIN_PROJECTS_ROOT:-/workspace/fixtures}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LOCAL_BASE_URL: ${LOCAL_BASE_URL:-http://vllm:8000/v1}
      LOCAL_MODEL: ${LOCAL_MODEL:-gremlin-vision}
      # Lets the container talk to an adb server running on the host, which is
      # how a USB-attached phone is reached without handing the container the
      # USB bus. Start it on the host with `adb start-server` first.
      ADB_SERVER_SOCKET: ${ADB_SERVER_SOCKET:-tcp:host.docker.internal:5037}
    extra_hosts:
      # Docker does not define host.docker.internal on Linux by default.
      - "host.docker.internal:host-gateway"
    devices:
      # Hardware acceleration for the Android emulator. Without it the emulator
      # either refuses to start or falls back to an ARM image so slow that a
      # run times out. This is a device mapping, not a privileged container.
      - /dev/kvm:/dev/kvm
    group_add:
      # /dev/kvm is root:kvm 0660, so access is by group, and the group id
      # differs between hosts. scripts/lab_env.sh reads the real one from the
      # host; 104 is Debian's default and only a fallback.
      - "${KVM_GID:-104}"
    ports:
      # The Gremlin console (FastAPI + Vite).
      - "127.0.0.1:${CONSOLE_PORT:-8080}:8080"
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    # Deliberately no depends_on: the backend is chosen per-run, and the dev
    # shell must be usable while a model is still downloading — or with no
    # model at all, for work that does not need one.
    stdin_open: true
    tty: true

volumes:
  hf-cache:
  ollama-models:
  claude-config:
  git-state:
