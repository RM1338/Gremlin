<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Nib, drawn as a mark rather than cropped from the illustration.

       The previous favicon carried six values at once — teal head, darker teal
       ears, mauve inner ear, cream eye white, amber iris, dark pupil — plus a
       side shadow and a highlight, on a head pushed hard against the frame.
       Below about 48px all of that turns to mud, which is why it read as
       clip-art rather than as a logo.

       This is the same silhouette (head and ear paths lifted from Mascot.jsx,
       so it is demonstrably the same creature) reduced to two hues and no
       modelling: amber ground, one flat teal, and the eyes cut straight back
       to the ground colour. Eyes are at Nib's true r18 proportion, not the r24
       they were inflated to; the ears carry the recognition instead, which is
       what they are shaped for. Content is inset 8% so the mark has margins. -->
  <rect width="512" height="512" fill="#E8A63C"/>
  <g transform="translate(4.0 67.4) scale(2.1)">
    <g fill="#1F4640">
      <path d="M64 84 q-34 -30 -44 -68 q34 8 56 36 q10 14 12 30 Z"/>
      <path d="M176 84 q34 -30 44 -68 q-34 8 -56 36 q-10 14 -12 30 Z"/>
      <path d="M56 96 q0 -58 64 -58 q64 0 64 58 q0 42 -22 56 q-17 11 -42 11
               q-25 0 -42 -11 q-22 -14 -22 -56 Z"/>
    </g>
    <ellipse cx="94" cy="104" rx="18" ry="18.5" fill="#E8A63C"/>
    <ellipse cx="146" cy="104" rx="18" ry="18.5" fill="#E8A63C"/>
  </g>
</svg>
