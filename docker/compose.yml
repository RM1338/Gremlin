# Gremlin, containerised for the lab workstation.
#
# Two services, because the model and the engine have nothing in common: the
# `vllm` service owns the GPU and serves an OpenAI-compatible endpoint, and the
# `gremlin` service is the dev shell you work in. They meet over the compose
# network at http://vllm:8000/v1, which is the whole of the integration —
# exactly the "configuration-only" swap Objective 2 of PROPOSAL.md promises.
#
#   docker compose -f docker/compose.yml up -d vllm      # start the model
#   docker compose -f docker/compose.yml run --rm gremlin  # get a shell
#
# Run from the repo root. Every tunable below is read from .env.

name: gremlin

services:
  vllm:
    # Blackwell (RTX 5090, sm_120) needs CUDA 12.8+, and Qwen3-VL needs a vLLM
    # recent enough to know the architecture — so this deliberately floats
    # rather than pinning a version that predates either. Pin it once you have
    # a build that works, so your benchmark numbers stay reproducible.
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    # Weights are downloaded once into a named volume. Deleting the container
    # does not re-download tens of GB.
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      # Only needed for gated checkpoints; Qwen is Apache-2.0 and open.
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    # vLLM shares tensors between worker processes over /dev/shm, and the 64 MB
    # default is far too small — it shows up as a hang or a bus error at load.
    ipc: host
    command:
      - --model=${VLLM_MODEL:-Qwen/Qwen3-VL-8B-Instruct}
      # A stable alias, so switching checkpoints never touches Gremlin's config.
      - --served-model-name=gremlin-vision
      # Screenshots are large inputs; this is sized for one image plus the
      # short JSON decision the policy asks for, not for long conversations.
      - --max-model-len=${VLLM_MAX_LEN:-16384}
      - --gpu-memory-utilization=${VLLM_GPU_FRAC:-0.90}
      - '--limit-mm-per-prompt={"image":1}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # Weight loading is slow, hence the long start_period; until this passes,
      # the engine would only get connection refused.
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: ${VLLM_START_PERIOD:-15m}
    restart: unless-stopped

  gremlin:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      # The repo itself, live — edits inside the container are edits on disk.
      - ..:/workspace
      # Claude Code's login, kept off the bind mount so a rebuild never loses it.
      - claude-config:/home/gremlin/.claude
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LOCAL_BASE_URL: ${LOCAL_BASE_URL:-http://vllm:8000/v1}
      LOCAL_MODEL: ${LOCAL_MODEL:-gremlin-vision}
      # Lets the container talk to an adb server running on the host, which is
      # how a USB-attached phone is reached without handing the container the
      # USB bus. Start it on the host with `adb start-server` first.
      ADB_SERVER_SOCKET: ${ADB_SERVER_SOCKET:-tcp:host.docker.internal:5037}
    extra_hosts:
      # Docker does not define host.docker.internal on Linux by default.
      - "host.docker.internal:host-gateway"
    ports:
      # The Gremlin console (FastAPI + Vite).
      - "127.0.0.1:${CONSOLE_PORT:-8080}:8080"
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    depends_on:
      vllm:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  hf-cache:
  claude-config:
