# Overlay that gives the dev container the Android emulator's prerequisites.
#
# Kept separate from compose.yml because device passthrough is a privilege many
# managed hosts refuse. Merging it in unconditionally means a host that forbids
# /dev/kvm cannot start the dev shell at all — which is a much worse failure
# than simply not having an emulator.
#
#   docker compose -f compose.yml -f docker/compose.emulator.yml run --rm gremlin
#
# If that is rejected by an authorization plugin, the host does not permit
# device mapping. See docs/LAB_SETUP.md for the alternatives; the usual one is
# to drive a real phone over wireless adb, which needs no device at all.

services:
  gremlin:
    devices:
      # Hardware acceleration for the emulator. Without it QEMU falls back to
      # software CPU emulation, which is slow enough that a run times out.
      # This is a single device mapping, not a privileged container.
      - /dev/kvm:/dev/kvm
    group_add:
      # /dev/kvm is root:kvm 0660, so access is by group, and that group's id
      # is host-specific. scripts/lab_env.sh reads the real one into .env; 104
      # is Debian's default and only a fallback.
      - "${KVM_GID:-104}"
