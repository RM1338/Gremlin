# Overlay that serves a pre-downloaded, quantised checkpoint from a directory
# on the host instead of letting vLLM fetch its own weights.
#
#   VLLM_WEIGHTS=$HOME/models/qwen3-vl-32b-awq \
#   docker compose -f compose.yml -f docker/compose.vllm-local.yml \
#     --profile vllm up -d vllm
#
# Two problems it solves, both of which the base service hits on this host.
#
# The weights. vLLM downloads from Hugging Face on first start, and a network
# that intercepts TLS breaks that download in two separate places: the Python
# client (requests/urllib3), which honours REQUESTS_CA_BUNDLE, and the Rust Xet
# client, which ignores every CA variable and carries its own root store. Fetch
# the weights outside the container and the whole class of failure disappears —
# hence HF_HUB_OFFLINE below, which turns a silent reach-out into a loud error.
#
# The quantisation. A 32B checkpoint is ~64 GB at FP16 and does not fit a 32 GB
# card; at 4-bit AWQ it is ~20 GB and does. The base service names no
# quantisation, and `--quantization=` with an empty value is not valid, so this
# cannot be a variable with an empty default. An overlay replaces `command:`
# wholesale rather than merging it, which keeps the flags readable instead of
# turning them into conditionals.
#
# Get the weights with (on the host, where TLS already works):
#   HF_HUB_DISABLE_XET=1 huggingface-cli download \
#     QuantTrio/Qwen3-VL-32B-Instruct-AWQ --local-dir ~/models/qwen3-vl-32b-awq

services:
  vllm:
    # Pinned, not floating. `latest` requires a CUDA 13 driver; v0.11.0 is the
    # last image built on CUDA 12 and — separately — the release that added
    # Qwen3-VL. On a driver that cannot be upgraded without root, that pair of
    # facts is the only reason this combination runs at all.
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.11.0}
    volumes:
      # Merged with the base service's hf-cache rather than replacing it, so a
      # later switch back to a downloaded checkpoint still finds its cache.
      # Read-only: the server has no business writing to the weights.
      - ${VLLM_WEIGHTS:?set VLLM_WEIGHTS to the host directory holding the weights}:/models:ro
    environment:
      # There is nothing to fetch. Fail on a missing file instead of reaching
      # for a network that will reject the handshake anyway — a clear error at
      # startup beats a five-minute retry storm buried in the log.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    command:
      # A path, not a repo id.
      - --model=/models
      - --quantization=${VLLM_QUANT:-awq_marlin}
      # The same stable alias the base service uses, so LOCAL_MODEL never
      # changes no matter which checkpoint is mounted here.
      - --served-model-name=gremlin-vision
      # Gremlin sends one downscaled screenshot and wants a two-line JSON reply
      # back; context beyond this is KV cache bought and never used.
      - --max-model-len=${VLLM_MAX_LEN:-16384}
      # Lower than the base default on purpose: this card is shared, and ~20 GB
      # of weights plus KV cache already leaves little room for a neighbour.
      - --gpu-memory-utilization=${VLLM_GPU_FRAC:-0.75}
      - '--limit-mm-per-prompt={"image":1}'
    healthcheck:
      # Nothing to download, so readiness is weight-load time alone. The base
      # service allows 15 minutes for a cold fetch; this needs far less, and a
      # shorter period means a genuine failure surfaces sooner.
      start_period: ${VLLM_START_PERIOD:-5m}
